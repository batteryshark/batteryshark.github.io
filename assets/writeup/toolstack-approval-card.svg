<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">Operation approval card</title>
  <desc id="desc">A mock operation approval card showing a review request with caller, tool, operation, target, risk, reason, and approve or reject actions.</desc>
  <defs>
    <style>
      .bg { fill: #f4f5f1; }
      .phone { fill: #1f292b; }
      .screen { fill: #ffffff; }
      .card { fill: #ffffff; stroke: #d4dad5; stroke-width: 2; }
      .header { fill: #16343a; }
      .field { fill: #f4f6f2; stroke: #d9dfda; stroke-width: 1.5; }
      .approve { fill: #dcebd5; stroke: #456b3a; stroke-width: 2; }
      .reject { fill: #efd6d2; stroke: #8a3a32; stroke-width: 2; }
      .label { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f292b; }
      .small { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334044; }
      .tiny { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #667276; letter-spacing: .04em; }
      .mono { font: 650 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f292b; }
      .white { fill: #ffffff; }
      .muted { fill: #667276; }
    </style>
  </defs>

  <rect class="bg" width="1000" height="700"/>

  <text x="70" y="70" class="label">Approval should describe the operation</text>
  <text x="70" y="102" class="small">Not the shell command. Not the wrapper. The thing that will happen.</text>

  <rect x="330" y="120" width="340" height="550" rx="42" class="phone"/>
  <rect x="356" y="152" width="288" height="486" rx="28" class="screen"/>

  <rect x="376" y="188" width="248" height="72" rx="16" class="header"/>
  <text x="400" y="224" class="small white">Review required</text>
  <text x="400" y="248" class="tiny white">TOOLSTACK BROKER</text>

  <rect x="376" y="286" width="248" height="286" rx="16" class="card"/>

  <text x="398" y="320" class="tiny">CALLER</text>
  <rect x="398" y="330" width="204" height="34" rx="8" class="field"/>
  <text x="414" y="353" class="mono">hermes</text>

  <text x="398" y="386" class="tiny">OPERATION</text>
  <rect x="398" y="396" width="204" height="34" rx="8" class="field"/>
  <text x="414" y="419" class="mono">mail.create_draft</text>

  <text x="398" y="452" class="tiny">RISK</text>
  <rect x="398" y="462" width="96" height="34" rx="17" class="approve"/>
  <text x="424" y="485" class="tiny">WRITE</text>

  <rect x="506" y="462" width="96" height="34" rx="17" class="field"/>
  <text x="533" y="485" class="tiny">REVIEW</text>

  <text x="398" y="526" class="tiny">POLICY REASON</text>
  <text x="398" y="552" class="small">External message draft</text>

  <rect x="376" y="584" width="118" height="42" rx="21" class="reject"/>
  <text x="412" y="611" class="tiny">REJECT</text>

  <rect x="506" y="584" width="118" height="42" rx="21" class="approve"/>
  <text x="541" y="611" class="tiny">APPROVE</text>

  <rect x="720" y="200" width="210" height="78" rx="14" class="card"/>
  <text x="748" y="233" class="small">Broker owns truth</text>
  <text x="748" y="258" class="tiny">surface is messenger</text>

  <rect x="720" y="314" width="210" height="78" rx="14" class="card"/>
  <text x="748" y="347" class="small">Poll only</text>
  <text x="748" y="372" class="tiny">no callback route</text>

  <rect x="720" y="428" width="210" height="78" rx="14" class="card"/>
  <text x="748" y="461" class="small">Redacted card</text>
  <text x="748" y="486" class="tiny">no secrets, no tokens</text>

  <rect x="70" y="250" width="210" height="90" rx="14" class="card"/>
  <text x="98" y="285" class="small">Approve intent</text>
  <text x="98" y="313" class="tiny">not a process name</text>

  <rect x="70" y="376" width="210" height="90" rx="14" class="card"/>
  <text x="98" y="411" class="small">Show risk</text>
  <text x="98" y="439" class="tiny">target + reason</text>
</svg>
